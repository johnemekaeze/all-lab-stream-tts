    label: Berber
    code: BER

  - key: chichewa
    label: Chichewa
    code: NY

  - key: english
    label: English
    code: EN
    # English is the only language with accent groups. Each accent has its
    # own pair of reference speakers (see speakers.yaml).
    accents:
      - key: nigerian
        label: Nigerian English
        code: NG
      - key: ghanaian
        label: Ghanaian English
