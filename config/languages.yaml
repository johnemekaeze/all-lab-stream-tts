  - key: english
    label: English
    code: EN
    available: false
    unavailable_reason: not served by the deployed systems yet
    # English is the only language with accent groups. Each accent has its
    # own pair of reference speakers (see speakers.yaml). The accent selector
    # appears automatically once English becomes available again.
    accents:
