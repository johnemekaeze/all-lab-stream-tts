# ---------------------------------------------------------------------------
# Evaluation languages (38 total).
#
# key       : internal identifier, used in speakers.yaml and test_sentences.csv
# label     : text shown in the UI
# code      : short code used inside speaker IDs and audio cache paths
# accents   : OPTIONAL. Only languages that declare accents get an accent
#             selector in the UI. Currently only English does.
# available : OPTIONAL, default true. Set to false for a language the deployed
#             systems cannot speak yet. It keeps its speakers and sentences but
#             is never offered to a tester, so no trial can be started that the
#             model would reject. Flip it back to true (or delete the line) as
#             soon as the systems cover it.
#
# Do not add or remove languages without updating speakers.yaml and
# test_sentences.csv accordingly - the app validates that they agree.
#
# The 14 languages currently marked unavailable are the ones the deployed
# CosyVoice3 endpoint does not accept; it serves 24 of the 38 below.
# ---------------------------------------------------------------------------
languages:
  - key: afrikaans
    label: Afrikaans
    code: AF
    available: false
    unavailable_reason: not served by the deployed systems yet

  - key: amharic
    label: Amharic
    code: AM

